version: "3.9"
services:
  backend:
    build: ./backend
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
